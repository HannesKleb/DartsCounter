<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darts Counter</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../js/storage.js" defer></script>
    <script src="../js/dartboard.js" defer></script>
    <script src="../js/rules.js" defer></script>
    <script src="../js/stats.js" defer></script>
    <script src="../js/app.js" defer></script>
    <script src="../js/accounts.js" defer></script>
    <script src="../js/startPage.js" defer></script>
</head>
<body class="start-page">
    <div class="header">
        <h1>Darts Counter</h1>
    </div>
    <div class="content hero">
        <section class="board-stage" id="board-stage" aria-label="Dartscheibe, zum Drehen ziehen">
            <div class="board-floor" aria-hidden="true"></div>
            <div class="board-sway">
                <div class="board-3d" id="board-3d">
                    <div class="board-back" aria-hidden="true">
                        <span class="board-back-hanger"></span>
                        <strong>Darts Counter</strong>
                        <span>Kalibriert für 3 Kameras</span>
                    </div>
                    <div class="board-layer" data-label="">
                        <img src="../resources/board/board-face.webp" alt="Dartscheibe" draggable="false">
                    </div>
                    <div class="board-layer" data-label="Draht-Spinne">
                        <img src="../resources/board/board-wires.webp" alt="" draggable="false">
                    </div>
                    <div class="board-layer" data-label="Zahlenring aus Stahl">
                        <img src="../resources/board/board-ring.webp" alt="" draggable="false">
                    </div>
                    <div class="board-sheen" id="board-sheen" aria-hidden="true"></div>
                </div>
            </div>
        </section>
        <section class="hero-text">
            <h2 id="greeting">Hallo.</h2>
            <p class="hero-sub" id="last-game">Noch keine Spiele gespeichert.</p>
            <div class="hero-stats">
                <div class="hero-stat"><strong id="stat-average">–</strong><span>Average</span></div>
                <div class="hero-stat"><strong id="stat-field">–</strong><span>Lieblingsfeld</span></div>
                <div class="hero-stat"><strong id="stat-checkout">–</strong><span>Bestes Checkout</span></div>
            </div>
            <div class="hero-buttons">
                <button class="primary-btn" id="new-game-btn" onclick="bar('index.html')">Neues Spiel</button>
                <button class="input-btn" id="second-btn" hidden></button>
            </div>
            <div class="hero-board-buttons">
                <button class="ghost-btn" id="explode-btn">Aufbau zeigen</button>
                <button class="ghost-btn" id="spin-btn">Einmal drehen</button>
                <span class="hint">Scheibe ziehen zum Drehen</span>
            </div>
        </section>
    </div>
    <nav class="bar" aria-label="Hauptmenü">
        <button class="bar-btn-active" id="main" aria-current="page" onclick="bar('start.html')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg><span>Spielen</span></button>
        <button class="bar-btn" id="player" onclick="bar('player.html')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.8c1.8.7 3 2.5 3.5 5.2"/></svg><span>Spieler</span></button>
        <button class="bar-btn" id="stats" onclick="bar('stats.html')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Statistik</span></button>
        <button class="bar-btn" id="allGames" onclick="bar('allGames.html')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Verlauf</span></button>
        <button class="bar-btn" id="settings" onclick="bar('settings.html')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Mehr</span></button>
    </nav>
</body>
</html>
