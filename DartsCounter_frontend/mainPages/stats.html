<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darts Counter</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../js/storage.js" defer></script>
    <script src="../js/dartboard.js" defer></script>
    <script src="../js/rules.js" defer></script>
    <script src="../js/stats.js" defer></script>
    <script src="../js/app.js" defer></script>
    <script src="../js/accounts.js" defer></script>
    <script src="../js/statsPage.js" defer></script>
</head>
<body>
    <div class="header">
        <h1>Darts Counter</h1>
        <div class="page">
            <h2>Statistiken</h2>
        </div>
    </div>
    <div class="content" data-group="stats">
        <div class="selection-btn">
            <button class="selection-button" id="X01-btn" data-target="X01-stats" onclick="showMode('X01-stats', 'stats')">X01</button>
            <button class="selection-button" id="cricket-btn" data-target="CRICKET-stats" onclick="showMode('CRICKET-stats', 'stats')">Cricket</button>
            <button class="selection-button" id="around-the-clock-btn" data-target="ATC-stats" onclick="showMode('ATC-stats', 'stats')">Around the Clock</button>
            <button class="selection-button" id="g121-btn" data-target="G121-stats" onclick="showMode('G121-stats', 'stats')">121</button>
            <button class="selection-button" id="freies-spiel-btn" data-target="FREE-stats" onclick="showMode('FREE-stats', 'stats')">Freies Spiel</button>
        </div>
        <label class="checkbox filter"><input type="checkbox" id="show-bots"> Bots anzeigen</label>
        <div id="X01-stats" class="list-panel" data-panel data-mode="X01" style="display:none;"></div>
        <div id="CRICKET-stats" class="list-panel" data-panel data-mode="CRICKET" style="display:none;"></div>
        <div id="ATC-stats" class="list-panel" data-panel data-mode="ATC" style="display:none;"></div>
        <div id="G121-stats" class="list-panel" data-panel data-mode="G121" style="display:none;"></div>
        <div id="FREE-stats" class="list-panel" data-panel data-mode="FREE" style="display:none;"></div>
    </div>
    <div class="bar">
        <button class="bar-btn" id="main" onclick="bar('index.html')">Hauptseite</button>
        <button class="bar-btn" id="player" onclick="bar('player.html')">Spieler</button>
        <button class="bar-btn-active" id="stats" onclick="bar('stats.html')">Statistiken</button>
        <button class="bar-btn" id="allGames" onclick="bar('allGames.html')">Alle Spiele</button>
        <button class="bar-btn" id="settings" onclick="bar('settings.html')">Einstellungen</button>
    </div>
</body>
</html>
