<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darts Counter</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../js/storage.js" defer></script>
    <script src="../js/app.js" defer></script>
    <script src="../js/accounts.js" defer></script>
    <script src="../js/accountsPage.js" defer></script>
</head>
<body>
    <div class="header">
        <h1>Darts Counter</h1>
        <div class="page">
            <h2>Konten</h2>
        </div>
    </div>
    <div class="content" id="accounts-content">
        <section class="settings-section" id="create-section">
            <h3>Konto erstellen</h3>
            <p class="hint">Nur ein Spielername, keine E-Mail und kein echter Name. Die App erzeugt einen Zugangscode, den du weitergibst.</p>
            <form id="create-form" class="account-form">
                <label>Spielername
                    <input type="text" id="new-account-name" maxlength="16" autocomplete="off" required>
                </label>
                <label>Rolle
                    <select id="new-account-role">
                        <option value="player" selected>Spieler</option>
                        <option value="admin">Admin (darf Konten verwalten)</option>
                    </select>
                </label>
                <button type="submit" class="input-btn primary-btn">Konto erstellen</button>
            </form>
            <p class="form-error" id="create-error" role="alert"></p>
            <div id="new-card"></div>
        </section>
        <section class="settings-section">
            <h3>Alle Konten</h3>
            <div id="account-list"></div>
            <p class="form-error" id="list-error" role="alert"></p>
        </section>
    </div>
    <nav class="bar" aria-label="Hauptmenü">
        <button class="bar-btn" id="main" onclick="bar('start.html')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg><span>Spielen</span></button>
        <button class="bar-btn" id="player" onclick="bar('player.html')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.8c1.8.7 3 2.5 3.5 5.2"/></svg><span>Spieler</span></button>
        <button class="bar-btn" id="stats" onclick="bar('stats.html')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Statistik</span></button>
        <button class="bar-btn" id="allGames" onclick="bar('allGames.html')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Verlauf</span></button>
        <button class="bar-btn" id="settings" onclick="bar('settings.html')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Mehr</span></button>
    </nav>
</body>
</html>
