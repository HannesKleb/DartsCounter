<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darts Counter</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../js/storage.js" defer></script>
    <script src="../js/app.js" defer></script>
    <script src="../js/accounts.js" defer></script>
    <script src="../js/settingsPage.js" defer></script>
</head>
<body>
    <div class="header">
        <h1>Darts Counter</h1>
        <div class="page">
            <h2>Einstellungen</h2>
        </div>
    </div>
    <div class="content settings">
        <section class="settings-section">
            <h3>Konto</h3>
            <p class="hint" id="account-status"></p>
            <div class="settings-row" id="account-actions"></div>
        </section>
        <section class="settings-section">
            <h3>Verbindung</h3>
            <label>Backend-Adresse (leer = automatisch)
                <input type="text" id="backend-url" placeholder="z. B. https://darts.deine-domain.de">
            </label>
            <div class="settings-row">
                <button class="input-btn" id="backend-save">Speichern &amp; testen</button>
                <span id="backend-status" class="hint"></span>
            </div>
            <p class="hint" id="backend-source"></p>
            <div class="settings-row">
                <span id="sync-status" class="hint"></span>
                <button class="input-btn" id="sync-now" hidden>Jetzt hochladen</button>
            </div>
        </section>
        <section class="settings-section">
            <h3>Kameras</h3>
            <p class="hint">Nach dem Aufbau und nach jedem Verstellen einer Kamera einmal kalibrieren, damit die Pfeile genau erkannt werden.</p>
            <div class="settings-row">
                <button class="input-btn" onclick="bar('calibration.html')">Kameras kalibrieren</button>
            </div>
        </section>
        <section class="settings-section">
            <h3>Spiel</h3>
            <label>Standard-Eingabe
                <select id="input-mode">
                    <option value="keyboard">Tastatur</option>
                    <option value="board">Scheibe</option>
                </select>
            </label>
            <label>Standard-Stärke für neue Bots
                <select id="bot-level">
                    <option value="easy">Leicht</option>
                    <option value="medium">Mittel</option>
                    <option value="hard">Schwer</option>
                </select>
            </label>
            <label>Bot-Geschwindigkeit
                <select id="bot-delay">
                    <option value="300">Schnell</option>
                    <option value="700">Normal</option>
                    <option value="1200">Langsam</option>
                </select>
            </label>
            <span id="settings-status" class="hint"></span>
        </section>
        <section class="settings-section">
            <h3>Daten</h3>
            <div class="settings-row">
                <button class="input-btn" id="export-btn">Backup herunterladen</button>
                <label class="input-btn file-btn">Backup einspielen
                    <input type="file" id="import-file" accept="application/json,.json" hidden>
                </label>
            </div>
            <div class="settings-row">
                <button class="danger-btn" id="delete-games">Alle Spiele löschen</button>
                <button class="danger-btn" id="delete-players">Alle Spieler löschen</button>
            </div>
            <span id="data-status" class="hint"></span>
        </section>
    </div>
    <nav class="bar" aria-label="Hauptmenü">
        <button class="bar-btn" id="main" onclick="bar('index.html')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg><span>Spielen</span></button>
        <button class="bar-btn" id="player" onclick="bar('player.html')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.8c1.8.7 3 2.5 3.5 5.2"/></svg><span>Spieler</span></button>
        <button class="bar-btn" id="stats" onclick="bar('stats.html')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Statistik</span></button>
        <button class="bar-btn" id="allGames" onclick="bar('allGames.html')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Verlauf</span></button>
        <button class="bar-btn-active" id="settings" aria-current="page" onclick="bar('settings.html')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Mehr</span></button>
    </nav>
</body>
</html>
