<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darts Counter</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../js/storage.js" defer></script>
    <script src="../js/dartboard.js" defer></script>
    <script src="../js/rules.js" defer></script>
    <script src="../js/stats.js" defer></script>
    <script src="../js/app.js" defer></script>
    <script src="../js/accounts.js" defer></script>
    <script src="../js/allGamesPage.js" defer></script>
</head>
<body>
    <div class="header">
        <h1>Darts Counter</h1>
        <div class="page">
            <h2>Verlauf</h2>
        </div>
    </div>
    <div class="content" data-group="games">
        <div class="selection-btn">
            <button class="selection-button" id="X01-btn" data-target="X01-games" onclick="showMode('X01-games', 'games')">X01</button>
            <button class="selection-button" id="cricket-btn" data-target="CRICKET-games" onclick="showMode('CRICKET-games', 'games')">Cricket</button>
            <button class="selection-button" id="around-the-clock-btn" data-target="ATC-games" onclick="showMode('ATC-games', 'games')">Around the Clock</button>
            <button class="selection-button" id="g121-btn" data-target="G121-games" onclick="showMode('G121-games', 'games')">121</button>
            <button class="selection-button" id="freies-spiel-btn" data-target="FREE-games" onclick="showMode('FREE-games', 'games')">Freies Spiel</button>
        </div>
        <div id="X01-games" class="list-panel" data-panel data-mode="X01" style="display:none;"></div>
        <div id="CRICKET-games" class="list-panel" data-panel data-mode="CRICKET" style="display:none;"></div>
        <div id="ATC-games" class="list-panel" data-panel data-mode="ATC" style="display:none;"></div>
        <div id="G121-games" class="list-panel" data-panel data-mode="G121" style="display:none;"></div>
        <div id="FREE-games" class="list-panel" data-panel data-mode="FREE" style="display:none;"></div>
    </div>
    <nav class="bar" aria-label="Hauptmenü">
        <button class="bar-btn" id="main" onclick="bar('index.html')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg><span>Spielen</span></button>
        <button class="bar-btn" id="player" onclick="bar('player.html')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.8c1.8.7 3 2.5 3.5 5.2"/></svg><span>Spieler</span></button>
        <button class="bar-btn" id="stats" onclick="bar('stats.html')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Statistik</span></button>
        <button class="bar-btn-active" id="allGames" aria-current="page" onclick="bar('allGames.html')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Verlauf</span></button>
        <button class="bar-btn" id="settings" onclick="bar('settings.html')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Mehr</span></button>
    </nav>
</body>
</html>
