<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darts Counter</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../js/storage.js" defer></script>
    <script src="../js/dartboard.js" defer></script>
    <script src="../js/rules.js" defer></script>
    <script src="../js/stats.js" defer></script>
    <script src="../js/app.js" defer></script>
    <script src="../js/game.js" defer></script>
</head>
<body data-mode="CRICKET" class="game-page">
    <div class="header game-header">
        <div class="game-topbar">
            <button class="ghost-btn" id="back-btn" onclick="backBtn()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Menü</button>
            <div class="game-heading">
                <h2 id="game-title">Spiel</h2>
                <div class="game-options" id="game-options"></div>
            </div>
            <button class="danger-btn" id="abort-btn" onclick="abortGame()">Abbrechen</button>
        </div>
    </div>
    <div class="content game-layout">
        <section class="game-main" aria-label="Spieler">
            <div class="game-info" id="game-info"></div>
            <div class="stats" id="players"></div>
            <div id="cricket-board"></div>
        </section>
        <section class="button-board-system input-panel" data-group="board" aria-label="Eingabe">
            <div class="selection-btn segmented">
                <button class="selection-button" data-target="score-button-id" onclick="showMode('score-button-id', 'board')">Tastatur</button>
                <button class="selection-button" data-target="score-board-id" onclick="showMode('score-board-id', 'board')">Scheibe</button>
            </div>
            <div class="selection" id="selection-score-system">
                <div class="score-button" id="score-button-id" data-panel>
                    <div class="mult-row">
                        <button type="button" class="mult-btn active" id="single-btn" aria-pressed="true">Single</button>
                        <button type="button" class="mult-btn" id="double-btn" aria-pressed="false">Double</button>
                        <button type="button" class="mult-btn" id="triple-btn" aria-pressed="false">Triple</button>
                    </div>
                    <div class="num-grid">
                        <button type="button" data-number="1">1</button>
                        <button type="button" data-number="2">2</button>
                        <button type="button" data-number="3">3</button>
                        <button type="button" data-number="4">4</button>
                        <button type="button" data-number="5">5</button>
                        <button type="button" data-number="6">6</button>
                        <button type="button" data-number="7">7</button>
                        <button type="button" data-number="8">8</button>
                        <button type="button" data-number="9">9</button>
                        <button type="button" data-number="10">10</button>
                        <button type="button" data-number="11">11</button>
                        <button type="button" data-number="12">12</button>
                        <button type="button" data-number="13">13</button>
                        <button type="button" data-number="14">14</button>
                        <button type="button" data-number="15">15</button>
                        <button type="button" data-number="16">16</button>
                        <button type="button" data-number="17">17</button>
                        <button type="button" data-number="18">18</button>
                        <button type="button" data-number="19">19</button>
                        <button type="button" data-number="20">20</button>
                    </div>
                    <div class="extra-row">
                        <button type="button" data-number="25">Bull</button>
                        <button type="button" data-number="0">Miss</button>
                        <button type="button" class="undo-btn" id="undo-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Rückgängig</button>
                    </div>
                </div>
                <div class="score-board" id="score-board-id" data-panel style="display:none;">
                    <div class="board" id="board"></div>
                </div>
            </div>
        </section>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <div class="result-overlay" id="result-overlay" hidden></div>
</body>
</html>
