<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darts Counter</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../js/storage.js" defer></script>
    <script src="../js/dartboard.js" defer></script>
    <script src="../js/rules.js" defer></script>
    <script src="../js/stats.js" defer></script>
    <script src="../js/app.js" defer></script>
    <script src="../js/game.js" defer></script>
</head>
<body data-mode="X01">
    <div class="header">
        <h1>Darts Counter</h1>
        <div class="page">
            <h2 id="game-title">Spiel</h2>
            <div class="game-options" id="game-options"></div>
        </div>
    </div>
    <div class="content">
        <div class="game-topbar">
            <div class="back-btn">
                <button id="back-btn" onclick="backBtn()">Hauptseite</button>
            </div>
            <div class="game-info" id="game-info"></div>
            <div class="back-btn">
                <button id="abort-btn" onclick="abortGame()">Spiel abbrechen</button>
            </div>
        </div>
        <div class="stats" id="players"></div>
        <div class="button-board-system" data-group="board">
            <div class="selection-btn">
                <button class="selection-button" data-target="score-button-id" onclick="showMode('score-button-id', 'board')">Tastatur</button>
                <button class="selection-button" data-target="score-board-id" onclick="showMode('score-board-id', 'board')">Scheibe</button>
            </div>
            <div class="selection" id="selection-score-system">
                <div class="score-button" id="score-button-id" data-panel style="display:block;">
                    <table>
                        <tbody>
                            <tr>
                                <td class="score-button-numbers"><button data-number="1">1</button></td>
                                <td class="score-button-numbers"><button data-number="2">2</button></td>
                                <td class="score-button-numbers"><button data-number="3">3</button></td>
                                <td class="score-button-numbers"><button data-number="4">4</button></td>
                                <td class="score-button-numbers"><button data-number="5">5</button></td>
                                <td class="score-button-numbers"><button data-number="6">6</button></td>
                                <td class="score-button-numbers"><button data-number="7">7</button></td>
                            </tr>
                            <tr>
                                <td class="score-button-numbers"><button data-number="8">8</button></td>
                                <td class="score-button-numbers"><button data-number="9">9</button></td>
                                <td class="score-button-numbers"><button data-number="10">10</button></td>
                                <td class="score-button-numbers"><button data-number="11">11</button></td>
                                <td class="score-button-numbers"><button data-number="12">12</button></td>
                                <td class="score-button-numbers"><button data-number="13">13</button></td>
                                <td class="score-button-numbers"><button data-number="14">14</button></td>
                            </tr>
                            <tr>
                                <td class="score-button-numbers"><button data-number="15">15</button></td>
                                <td class="score-button-numbers"><button data-number="16">16</button></td>
                                <td class="score-button-numbers"><button data-number="17">17</button></td>
                                <td class="score-button-numbers"><button data-number="18">18</button></td>
                                <td class="score-button-numbers"><button data-number="19">19</button></td>
                                <td class="score-button-numbers"><button data-number="20">20</button></td>
                                <td class="score-button-numbers"><button data-number="25">25</button></td>
                            </tr>
                            <tr>
                                <td class="score-button-numbers"><button data-number="0">0</button></td>
                                <td class="score-button-extra" colspan="2"><button id="double-btn">Double</button></td>
                                <td class="score-button-extra" colspan="2"><button id="triple-btn">Triple</button></td>
                                <td class="score-button-extra" colspan="2"><button id="undo-btn">Zurück</button></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="score-board" id="score-board-id" data-panel style="display:none;">
                    <div class="board" id="board"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <div class="result-overlay" id="result-overlay" hidden></div>
</body>
</html>
