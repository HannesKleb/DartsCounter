<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darts Counter</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <div class="header">
        <h1>Darts Counter</h1>
        <div class="page">
            <h2>Hauptseite</h2>
        </div>
    </div>
    <div class="content">
        
        <div class="mode-selection">
            <div class="mode-selection-title"> 
                <h3>Spielmodus</h3> 
            </div>
            <div class="selection-btn"> 
                <button class="selection-button" id="X01-btn" onclick="showMode(`mode-X01`)">
                    X01
                </button>
                <button class="selection-button" id="cricket-btn" onclick="showMode(`mode-cricket`)">
                    Cricket
                </button>
                <button class="selection-button" id="around-the-clock-btn" onclick="showMode(`mode-around-the-clock`)">
                    Around the Clock
                </button>
                <button class="selection-button" id="g121-btn" onclick="showMode(`mode-g121`)">
                    121
                </button>
                <button class="selection-button" id="freies-spiel-btn" onclick="showMode(`mode-freies-spiel`)">
                    Freies Spiel
                </button>
            </div>
        </div>
        <div class="selection">
            <div id="mode-X01" style="display:block;">
                1
            </div>
            <div id="mode-cricket" style="display:none;">
                2
            </div>
            <div id="mode-around-the-clock" style="display:none;">
                3
            </div>
            <div id="mode-g121" style="display:none;">
                4
            </div>
            <div id="mode-freies-spiel" style="display:none;">
                5
            </div>
        </div>
        <div class="player-selection">
            <div class="player-selection-title"> 
                <h3>Spieler</h3> 
            </div>
            <div class="selection-btn">
                <button class="selection-button" id="add-player" onclick="add(true)">
                    Spieler Hinzufügen
                </button>
                <button class="selection-button" id="add-bot" onclick="add(false)">
                    Bot hinzufügen
                </button>
            </div>
            <div class="player-list">
                <div id="player_1">
                    <p>Name1</p>
                    <button>Löschen</button>
                </div>
                <div id="player_2">
                </div>
                <div id="player_3">
                </div>
                <div id="player_4">
                </div>
                <div id="player_5">
                </div>
                <div id="player_6">
                </div>
                <div id="player_7">
                </div>
                <div id="player_8">
                </div>
            </div>
        </div>
        <div class="start" id="start">
            <button onclick="start()">
                Start
            </button>
        </div>
    </div>
    <div class="bar">
        <button class="bar-btn-active" id="main" onclick="bar(`index.html`)">Hauptseite</button>
        <button class="bar-btn" id="player" onclick="bar(`player.html`)">Spieler</button>
        <button class="bar-btn" id="stats" onclick="bar(`stats.html`)">Statistiken</button>
        <button class="bar-btn" id="allGames" onclick="bar(`allGames.html`)">Alle Spiele</button>
        <button class="bar-btn" id="settings" onclick="bar(`settings.html`)">Einstellungen</button>
    </div>
</body>
</html>
