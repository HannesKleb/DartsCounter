<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darts Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>Dart Counter</h1>
    </div>
    <div class="content">
        <div class="mode-selection">
            <div class="mode-selection-title"> 
                <h2>Spielmodus</h2> 
            </div>
            <div class="selection-btn"> 
                <button id="X01">
                    X01
                </button>
                <button id="cricket">
                    Cricket
                </button>
                <button id="around-the-clock">
                    Around the Clock
                </button>
                <button id="einhunderteinundzewanzig">
                    121
                </button>
                <button id="freies-spiel">
                    Freies Spiel
                </button>
            </div>
        </div>
        <div class="player-selection">
            <div class="player-selection-title"> 
                <h2>Spieler</h2> 
            </div>
            <div class="selection-btn">
                <button id="add-player">
                    Spieler Hinzufügen
                </button>
                <button id="add-bot">
                    Bot hinzufügen
                </button>
            </div>
            <div class="player-list">
                
            </div>
        </div>
        <div class="start">
            <button>
                Start
            </button>
        </div>
    </div>
</body>
</html>
