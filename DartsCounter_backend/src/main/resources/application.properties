spring.application.name=DartsCounter_backend
# Ordner für Spieler, Spiele und Einstellungen
dartscounter.data-dir=${user.home}/dartscounter-data

# Konten: Kosten für BCrypt (10 = ca. 0,1-0,3 s pro Anmeldung auf dem Pi)
dartscounter.auth.bcrypt-strength=10

# Zugriff von außen (Cloudflare Tunnel oder Adresse außerhalb des Heimnetzes):
# tunnel = von außen Anmeldung nötig (Heimnetz frei), always = immer, never = nie
# /api/data: jedes Konto, /services (Kameras): nur Admin
dartscounter.data.require-login=tunnel
dartscounter.services.require-login=tunnel

# Kameras: Index (0, 2, 4) oder Pfad zu einer Videodatei (zum Testen ohne Kamera), Reihenfolge = Kamera 1, 2, 3
dartscounter.cameras=0,2,4
# 640x480 ist für den Pi 3 mit drei Kameras gedacht; ein Pi 4/5 schafft auch 1280x720.
# Nach jeder Änderung neu kalibrieren (die Kalibrierung rechnet in Pixeln dieser Auflösung).
dartscounter.camera.width-px=640
dartscounter.camera.height-px=480
# Ausgewertete Bilder pro Sekunde und Kamera (überzählige werden übersprungen, die Kameras liefern oft 30).
# Pi 3 mit drei Kameras: 8 (ein Bild braucht dort ca. 75 ms), Pi 4/5: 15
dartscounter.camera.fps=8
# Grobe Montage, nur bis zur ersten Kalibrierung: Position um die Scheibe (0° = oben, im Uhrzeigersinn),
# Abstand zum Bullseye in mm, horizontales Sichtfeld in Grad
dartscounter.camera.positions-deg=0,120,240
dartscounter.camera.distance-mm=500
dartscounter.camera.fov-deg=60
# Meldungen der Kameras innerhalb dieses Fensters gehören zum selben Pfeil
dartscounter.detection.window-ms=1200
# Breite, auf die jedes Bild vor der Erkennung verkleinert wird. 320 = halbe Breite: etwa viermal schneller,
# und die Kamerabilder werden gleich in halber Größe entpackt. Pi 4/5: 640 für etwas mehr Genauigkeit
dartscounter.detection.process-width=320
# So viele Bilder hintereinander muss ein Pfeil ruhig an derselben Stelle zu sehen sein (filtert Rauschen und Schatten)
dartscounter.detection.stable-frames=3
# Wo die Pfeilspitze im Kamerabild liegt: top = oberster Punkt (Kamera kopfüber montiert), bottom = unterster Punkt
dartscounter.camera.tip=top
# Weißabgleich nach 2 s festhalten (sonst springen die Farben und alles gilt als Bewegung)
dartscounter.camera.lock-white-balance=true
# Kamera-Regler, die mit v4l2-ctl gesetzt werden. Kameras nennen sie unterschiedlich, deshalb stehen
# mehrere Varianten drin; was die Kamera nicht kennt, wird übersprungen. Alle Regler einer Kamera anzeigen:
#   v4l2-ctl -d /dev/video0 --list-ctrls
# Beim Start: 50-Hz-Stromnetz (gegen Flimmern und Streifen bei Lampenlicht), Bildrate nicht automatisch absenken
dartscounter.camera.controls-start=power_line_frequency=1,exposure_dynamic_framerate=0,exposure_auto_priority=0
# Nach 2 s (wenn die Kamera sich eingestellt hat): automatischen Weißabgleich aus
dartscounter.camera.controls-lock=white_balance_automatic=0,white_balance_temperature_auto=0
# Kamerabilder roh holen und in halber Größe entpacken (schneller). Bei kaputten Bildern zum Vergleich auf false
dartscounter.camera.fast-decode=true
# true: POST /services/test/detection simuliert Kameras (zum Testen ohne Scheibe und Kameras)
dartscounter.detection.simulate=false
# Masken als PNG in subFrames/ speichern (nur zum Debuggen, füllt sonst die SD-Karte)
dartscounter.debug.save-frames=false
