spring.application.name=DartsCounter_backend

# Erlaubte Frontend-Adressen (VS Code Live Server)
darts.cors.origins=http://127.0.0.1:5500,http://localhost:5500

# Kamera-Indizes (Reihenfolge = Kamera 1, 2, 3)
darts.cameras=0,2,4
# Position jeder Kamera um die Scheibe in Grad (0 = oben bei der 20, gegen den Uhrzeigersinn)
darts.camera.positions-deg=0,120,240
# Pixel-Spalte, in der die Kamera die Scheibenmitte sieht (pro Kamera kalibrieren)
darts.camera.center-x=910,910,910
# Abstand Kamera -> Bullseye in cm
darts.camera.distance-cm=50
# Horizontales Sichtfeld in Grad und Bildbreite in Pixel
darts.camera.fov-deg=60
darts.camera.width-px=1920
darts.camera.height-px=1080
# true, wenn die Kameras gespiegelt bzw. andersherum montiert sind (Treffer landen sonst gespiegelt)
darts.camera.invert-x=false
# Zeitfenster, in dem Meldungen verschiedener Kameras als derselbe Pfeil gelten
darts.detection.match-window-ms=500

# Debug: Masken als PNG speichern und jedes Frame loggen (nur zum Testen, füllt sonst die SD-Karte)
darts.debug.save-frames=false
darts.debug.log-frames=false
darts.debug.frames-dir=subFrames
