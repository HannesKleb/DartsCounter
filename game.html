<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darts Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>Spiel</h1>
    </div>
    <div class="container">
        <div class="scoring-stats">
            <div class="big-scoring-stats">
                <div class="player">

                </div>
                <div class="score-left">

                </div>
            </div>
            <div class="small-scoring-stats">
                <div class="score-thrown">

                </div>
                <div class="finish-way">

                </div>
            </div>
        </div>
        <div class="score-buttons">
            <div class="score-buttons-numbers">
                <table>
                    <tbody>
                        <tr>
                            <td><a href="">1</a></td>
                            <td><a href="">2</a></td>
                            <td><a href="">3</a></td>
                            <td><a href="">4</a></td>
                            <td><a href="">5</a></td>
                            <td><a href="">6</a></td>
                            <td><a href="">7</a></td>
                        </tr>
                        <tr>
                            <td><a href="">8</a></td>
                            <td><a href="">9</a></td>
                            <td><a href="">10</a></td>
                            <td><a href="">11</a></td>
                            <td><a href="">12</a></td>
                            <td><a href="">13</a></td>
                            <td><a href="">14</a></td>
                        </tr>
                        <tr>
                            <td><a href="">15</a></td>
                            <td><a href="">16</a></td>
                            <td><a href="">17</a></td>
                            <td><a href="">18</a></td>
                            <td><a href="">19</a></td>
                            <td><a href="">20</a></td>
                            <td><a href="">25</a></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="score-buttons-extra">
                <table>
                    <tbody>
                        <tr>
                            <td><a href="">0</a></td>
                            <td><a href="">Double</a></td>
                            <td><a href="">Triple</a></td>
                            <td><a href="">Back</a></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
